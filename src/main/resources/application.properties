# flnet is a CLI: no banner, no framework logging on the terminal.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."io.quarkus".level=ERROR
quarkus.log.category."org.hibernate.validator".level=WARN
# English messages (e.g. validation) regardless of the machine's locale
quarkus.default-locale=en
quarkus.locales=en

# Embedded deployment bundles and the migration catalog must end up in the native binary.
quarkus.native.resources.includes=bundles/**,migrations/**

# Tool templates are Python/Markdown files, rendered with Qute. Missing values are bugs.
quarkus.qute.strict-rendering=true

# Index picocli so its built-in 'generate-completion' command is registered for reflection
# like our own commands (required for the native binary).
quarkus.index-dependency.picocli.group-id=info.picocli
quarkus.index-dependency.picocli.artifact-id=picocli

# Per machine overrides (e.g. an organisation's own network); a missing file is ignored.
quarkus.config.locations=${user.home}/.config/flnet/application.properties
# tests must not depend on the developer's personal settings
%test.quarkus.config.locations=

# =============================================================================
# flnet settings (FLNetCliConfig)
# Override any value in ~/.config/flnet/application.properties, as environment
# variable (flnet.client.port -> FLNET_CLIENT_PORT) or system property.
# =============================================================================

# Root of all instances: <home>/clients/<name>, <home>/platforms/<name>. Unset = ~/fl-net
# flnet.home=/opt/fl-net
flnet.documentation-url=https://federated-learning.net/documentation
flnet.keycloak-realm-path=/auth/realms/FLNet-Platform

# Networks a client can join with 'flnet client init --network <key>'. Add your own
# self-deployed platform here to offer it by name. 'custom' is reserved.
flnet.networks.flnet.name=FL-Net
flnet.networks.flnet.order=1
flnet.networks.flnet.platform-url=https://federated-learning.net
flnet.networks.flnet.relay-port=9152
flnet.networks.flnet.client-auth=true
flnet.networks.flnet.frontend=fl-net

flnet.networks.microbaiome.name=MicrobAIome
flnet.networks.microbaiome.order=2
flnet.networks.microbaiome.platform-url=https://microb-ai-net.federated-learning.net
flnet.networks.microbaiome.aliases=https://microb-ai-net.cosy.bio
flnet.networks.microbaiome.relay-port=9154
flnet.networks.microbaiome.client-auth=false
flnet.networks.microbaiome.frontend=microbaiome

flnet.networks.daibetes.name=dAIbetes
flnet.networks.daibetes.order=3
flnet.networks.daibetes.platform-url=https://daibetes-net.federated-learning.net
flnet.networks.daibetes.aliases=https://daibetes-net.cosy.bio
flnet.networks.daibetes.relay-port=9153
flnet.networks.daibetes.client-auth=false
flnet.networks.daibetes.frontend=daibetes

# Images: frontends are <registry>/global-<frontend>:<tag> (platform) and
# <registry>/local-<frontend>:<tag> (client)
flnet.images.tag=latest
flnet.images.frontend.registry=ghcr.io/fedlearnnet/frontends
flnet.images.frontend.default=fl-net

# Generated passwords and client secrets (alphanumeric)
flnet.secrets.length=64
flnet.secrets.admin-password-length=16

flnet.compose.generated-file=docker-compose.generated.yml

# Client defaults ('flnet client init')
flnet.client.project-name=fl-net-client
flnet.client.default-network=flnet
flnet.client.port=8250
flnet.client.custom-relay-port=9152
flnet.client.keycloak-admin-username=keycloak-admin
flnet.client.permission.query-retry-time=3
flnet.client.permission.query-sample-threshold=100
flnet.client.certificate.days=365

# Platform defaults ('flnet platform init')
flnet.platform.project-name=fl-net-platform
flnet.platform.domain=http://localhost
flnet.platform.bind-ip=127.0.0.1
flnet.platform.port=8250
flnet.platform.relay-port=9150
flnet.platform.min-clients=3
flnet.platform.keycloak-admin-username=admin

# Tool projects ('flnet tool create')
flnet.tool.sdk-version=0.7.12
flnet.tool.base-image=gitlab.cosy.bio:5050/cosybio/federated-learning/federated_db/pyfedappwrap/base-python:0.6.40
flnet.tool.platform-url=https://federated-learning.net
flnet.tool.app-id=1
flnet.tool.env.config-sync=false
flnet.tool.env.trace-performance=false
flnet.tool.env.project-startup=false
flnet.tool.env.prio-local-config=false
flnet.tool.env.send-console-logs=false
