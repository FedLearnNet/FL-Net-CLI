# =====================================================================
# This is a normal Flower App bundle for {tool.name} - see the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{tool.slug}"
version = "1.0.0"
description = {tool.descriptionYaml}
dependencies = [
    "flwr>=1.43.0",
    "numpy>=2.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flnet"

# Point to your ServerApp and ClientApp objects - format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "{tool.pythonPackage}.server_app:app"
clientapp = "{tool.pythonPackage}.client_app:app"

# Custom run config, accessible via `context.run_config` in server_app.py/client_app.py.
# Override at run time with `flwr run --run-config 'num-server-rounds=5'`.
[tool.flwr.app.config]
num-server-rounds = 3
