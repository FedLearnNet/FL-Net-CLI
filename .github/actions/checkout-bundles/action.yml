name: Checkout deployment bundles
description: Checks out the platform and client deployment repositories that are embedded into flnet.
inputs:
  ref:
    description: Branch or tag of the deployment repositories.
    default: main
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: FedLearnNet/FL-Net-Platform-Deployment
        ref: ${{ inputs.ref }}
        path: deps/platform
    - uses: actions/checkout@v4
      with:
        repository: FedLearnNet/FL-Net-Client-Deployment
        ref: ${{ inputs.ref }}
        path: deps/client
