name: End-to-end test

# Sets up a real platform and client with the CLI (docker compose), waits for all health endpoints
# and removes everything again. Pulls several GB of images, so it runs nightly and on demand
# instead of on every push.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Images under test: staging (develop builds) or latest (main builds)"
        default: staging
        type: choice
        options: [staging, latest]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B --no-transfer-progress

jobs:
  e2e:
    name: Platform and client (${{ inputs.image-tag || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: End-to-end test
        run: ./mvnw test -Pe2e -De2e.image-tag=${{ inputs.image-tag || 'staging' }} -De2e.timeout-minutes=20
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: target/surefire-reports/
          retention-days: 7
