name: Build and release flnet

# The version comes from pom.xml. The first build of a new X.Y.Z.rcN (develop) or X.Y.Z (main) publishes it as a
# GitHub release, see FedLearnNet/.github/actions/version. Every main build also replaces the rolling "latest" release.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_ARGS: -B --no-transfer-progress

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        uses: FedLearnNet/.github/actions/version@main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw verify

  native:
    needs: [version, test]
    if: needs.version.outputs.release == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, asset: flnet-linux-amd64 }
          - { runner: ubuntu-24.04-arm, asset: flnet-linux-arm64 }
          - { runner: macos-latest, asset: flnet-darwin-arm64 }
          - { runner: macos-15-intel, asset: flnet-darwin-amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # Quarkus 3.39 native builds require GraalVM/Mandrel 25.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native executable
        run: ./mvnw package -Dnative -DskipTests
      - name: Smoke test
        run: |
          ./target/*-runner --version
          ./target/*-runner tool create smoke --type analysis --federated --no-input -o "$RUNNER_TEMP/smoke"
          test -f "$RUNNER_TEMP/smoke/aggregator.py"
          ./target/*-runner client init --no-input --dir "$RUNNER_TEMP/client" --network daibetes
          test -f "$RUNNER_TEMP/client/env/keycloak-secrets.env"
          # macOS runners have no docker CLI
          if [ "$RUNNER_OS" = "Linux" ]; then
            ./target/*-runner client compose --dir "$RUNNER_TEMP/client" -o - --keep-variables | grep -q "name: fl-net-client"
          fi
          ./target/*-runner generate-completion > /dev/null
          mv target/*-runner "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  jar:
    needs: [version, test]
    if: needs.version.outputs.release == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw package -DskipTests -Dquarkus.package.jar.type=uber-jar
      - run: mv target/*-runner.jar flnet.jar && java -jar flnet.jar --version
      - uses: actions/upload-artifact@v7
        with:
          name: flnet.jar
          path: flnet.jar
          if-no-files-found: error

  release:
    needs: [version, native, jar]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp install.sh dist/
          cd dist && sha256sum flnet-* flnet.jar install.sh > SHA256SUMS && cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "flnet $VERSION" --generate-notes --prerelease="$PRERELEASE"

  release-latest:
    needs: [native, jar]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp install.sh dist/
          cd dist && sha256sum flnet-* flnet.jar install.sh > SHA256SUMS && cat SHA256SUMS
      - name: Replace the latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --title "flnet (latest, $(git rev-parse --short HEAD))" --prerelease \
            --notes "Continuously rebuilt from the newest commit on main; replaced on every push. For a stable, permanent release, use a tagged version instead."
